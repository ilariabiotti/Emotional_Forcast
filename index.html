<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotional Forecast</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050812;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    .sky {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(
          ellipse at 50% 100%,
          #172b3d 0%,
          #0b1424 45%,
          #050812 100%
        );
      overflow: hidden;
    }

    .aurora {
      position: absolute;
      width: 120%;
      height: 70%;
      left: -10%;
      top: 15%;

      background:
        radial-gradient(
          ellipse at 30% 50%,
          rgba(80, 255, 210, 0.45),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 55% 45%,
          rgba(120, 150, 255, 0.35),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 75% 55%,
          rgba(210, 120, 255, 0.35),
          transparent 45%
        );

      filter: blur(35px);

      animation: moveAurora 12s ease-in-out infinite alternate;
    }

    @keyframes moveAurora {
      from {
        transform: translateX(-5%) scale(1);
      }

      to {
        transform: translateX(5%) scale(1.1);
      }
    }

    .title {
      position: absolute;
      top: 30px;
      left: 30px;

      color: rgba(255,255,255,0.8);
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <main class="sky">

    <div class="aurora"></div>

    <div class="title">
      <h1>Emotional Forecast</h1>
      <p>An artistic research project and atmospheric map of collective feelings</p>
    </div>

    <div class="coming-soon">
      <p>Ilaria Biotti’s website coming soon.</p>
    </div>

    <a class="old-website" href="https://ilariabiotti.github.io/">
       Old website →
    </a>

  </main>

</body>
</html>
